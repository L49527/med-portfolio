<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評量展示助手 v1.1</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063176.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="醫學助手">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="h-screen flex flex-col text-slate-800 bg-slate-50">

    <header
        class="bg-white text-slate-800 px-6 py-4 flex flex-wrap justify-between items-center shadow-xl z-[200] flex-none border-b border-slate-200 gap-4">
        <div class="flex items-center gap-4">
            <img src="logo.png" alt="輔大醫院" class="h-20">
            <div>
                <h1 class="text-lg font-black text-slate-800 leading-tight">輔仁大學附設醫院 <span
                        class="text-teal-600">評量展示助手</span>
                </h1>
                <p class="text-[10px] text-slate-500 italic tracking-widest uppercase">Fu Jen Catholic University
                    Hospital | Medical Education Assessment</p>
            </div>
        </div>
        <div class="flex flex-wrap gap-2 text-white">
            <div id="normalModeBtns" class="flex gap-2">
                <button id="cardModeBtn" onclick="switchView('card')"
                    class="px-4 py-1.5 rounded-xl font-black transition flex items-center gap-2 shadow-md hover:bg-slate-700 bg-slate-800 mode-active text-sm"><i
                        class="fas fa-th-large"></i> <span>卡片</span></button>
                <button id="compareModeBtn" onclick="switchView('compare')"
                    class="px-4 py-1.5 rounded-xl font-black transition flex items-center gap-2 shadow-md hover:bg-blue-700 bg-blue-600 text-sm"><i
                        class="fas fa-right-left"></i> <span>互比</span></button>
                <button id="chartModeBtn" onclick="switchView('chart')"
                    class="px-4 py-1.5 rounded-xl font-black transition flex items-center gap-2 shadow-md hover:bg-indigo-700 bg-indigo-600 text-sm"><i
                        class="fas fa-award"></i> <span>成果展</span></button>
            </div>
            <button onclick="printAccreditationReport()"
                class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-1.5 rounded-xl font-black transition flex items-center gap-2 shadow-md text-sm"><i
                    class="fas fa-print"></i> 列印</button>
            <button onclick="clearHistory()" title="全部清空"
                class="bg-slate-800 hover:bg-red-600 px-3 py-1.5 rounded-lg transition text-xs text-white"><i
                    class="fas fa-trash-alt"></i></button>
        </div>
    </header>

    <div id="appContainer" class="flex flex-1 overflow-hidden relative">
        <div id="sidebar" class="bg-white border-r border-slate-200 flex flex-col shadow-xl z-30 relative">
            <button onclick="toggleSidebar()"
                class="w-full py-8 flex flex-col items-center gap-4 hover:bg-teal-50 text-teal-600 transition-all border-b border-slate-100 flex-none">
                <i id="sidebarIcon" class="fas fa-angles-right text-xl"></i>
                <span id="sidebarBtnLabel" class="text-[9px] font-black uppercase vertical-text">開啟匯入區</span>
            </button>
            <div id="sidebarContent" class="p-6 flex-1 overflow-hidden flex flex-col">
                <div class="mb-4 text-teal-600 font-bold flex items-center gap-2 text-base"><i
                        class="fas fa-file-circle-plus"></i><span>批次資料匯入</span></div>
                <div id="dropZone"
                    class="border-4 border-dashed border-slate-200 rounded-[2.5rem] flex-1 flex flex-col items-center justify-center p-6 transition-all hover:border-teal-500 hover:bg-teal-50 group cursor-pointer shadow-inner bg-slate-50">
                    <i
                        class="fas fa-cloud-arrow-up text-7xl text-slate-200 group-hover:text-teal-500 mb-6 transition-transform group-hover:scale-110"></i>
                    <p
                        class="text-xl font-black text-slate-500 group-hover:text-teal-600 text-center leading-tight tracking-tighter">
                        將 CSV 檔案<br>丟入此處匯入</p>
                    <input type="file" id="fileInput" multiple accept=".csv" class="hidden">
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-slate-100 overflow-hidden relative">
            <div
                class="bg-white px-10 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-4 shadow-sm z-10 font-black">
                <div class="flex flex-wrap items-center gap-3">
                    <button onclick="setFilter('all')" id="f_all" class="filter-btn active-filter">全部</button>
                    <button onclick="setFilter('Milestone')" id="f_Milestone"
                        class="filter-btn text-teal-600">里程碑</button>
                    <button onclick="setFilter('DOPS')" id="f_DOPS" class="filter-btn text-purple-600">DOPS</button>
                    <button onclick="setFilter('Mini-CEX')" id="f_Mini-CEX"
                        class="filter-btn text-orange-600">Mini-CEX</button>
                    <button onclick="setFilter('CbD')" id="f_CbD" class="filter-btn text-emerald-600">CbD</button>
                    <button onclick="setFilter('EPA')" id="f_EPA" class="filter-btn text-blue-600">EPA</button>
                    <button onclick="setFilter('筆試成績')" id="f_筆試成績" class="filter-btn text-indigo-600">筆試</button>
                    <button onclick="setFilter('問卷調查')" id="f_問卷調查" class="filter-btn text-pink-600">問卷</button>
                    <div class="h-6 w-px bg-slate-200 mx-2"></div>
                    <select id="studentFilter" onchange="setStudentFilter(this.value)"
                        class="custom-select border-blue-200 text-blue-800">
                        <option value="all">所有學員</option>
                    </select>
                    <select id="trainingFilter" onchange="setTrainingFilter(this.value)"
                        class="custom-select border-emerald-200 text-emerald-800">
                        <option value="all">所有訓練別</option>
                    </select>
                </div>
                <button onclick="toggleSort()"
                    class="bg-slate-50 hover:bg-teal-50 text-slate-600 px-5 py-2.5 rounded-2xl text-sm font-black border border-slate-200 shadow-sm transition-colors">
                    <i class="fas fa-arrows-up-down text-teal-500" id="sortIcon"></i>
                    <span id="sortText">日期：舊到新</span>
                </button>
            </div>

            <div class="flex-1 p-6 overflow-y-auto" id="historyContainer">
                <div id="emptyState"
                    class="h-full flex flex-col items-center justify-center text-slate-300 opacity-40 text-center leading-loose">
                    <i class="fas fa-layer-group text-9xl mb-6"></i>
                    <p class="text-xl font-light tracking-widest uppercase italic">請由左側展開並匯入檔案</p>
                </div>
            </div>
            <div class="hidden flex-1 p-6 overflow-auto bg-white shadow-inner" id="compareContainer"></div>
            <div class="hidden flex-1 flex flex-col overflow-hidden bg-slate-100" id="chartContainer">
                <!-- Item Selector Panel -->
                <div id="chartSelectorPanel"
                    class="bg-white border-b border-slate-200 shadow-sm flex-none print-hide rounded-b-xl max-w-5xl mx-auto w-full transition-all">
                    <!-- Collapse Toggle Header -->
                    <button onclick="toggleChartSelector()"
                        class="w-full flex items-center justify-between px-6 py-3 hover:bg-slate-50 transition-colors border-b border-slate-100 group">
                        <h3 class="text-sm font-black text-slate-700 flex items-center gap-2">
                            <i class="fas fa-check-double text-indigo-500"></i>
                            選擇要納入成果展的評量項目
                        </h3>
                        <div class="flex items-center gap-3">
                            <span
                                class="text-xs text-slate-400 font-bold group-hover:text-indigo-500 transition-colors">展開
                                / 收合</span>
                            <i id="chartSelectorIcon"
                                class="fas fa-chevron-down text-slate-400 transition-transform duration-300"></i>
                        </div>
                    </button>
                    <!-- Expandable Content -->
                    <div id="chartSelectorContent" class="px-6 py-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex gap-2">
                                <button onclick="selectAllChartItems(true)"
                                    class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1 rounded-lg font-bold transition">全選</button>
                                <button onclick="selectAllChartItems(false)"
                                    class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1 rounded-lg font-bold transition">全不選</button>
                            </div>
                        </div>
                        <!-- Quick Filters Row -->
                        <div class="flex flex-wrap gap-4 mb-3 pb-3 border-b border-slate-100">
                            <!-- Instrument Filter -->
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-500"><i
                                        class="fas fa-microscope mr-1"></i>儀器別：</span>
                                <div id="instrumentFilterBtns" class="flex flex-wrap gap-1">
                                    <!-- Dynamic instrument buttons -->
                                </div>
                            </div>
                            <!-- Type Filter -->
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-500"><i
                                        class="fas fa-tags mr-1"></i>類型：</span>
                                <div id="typeFilterBtns" class="flex flex-wrap gap-1">
                                    <!-- Dynamic type buttons -->
                                </div>
                            </div>
                            <!-- Student Filter -->
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-500"><i
                                        class="fas fa-user-graduate mr-1"></i>學員：</span>
                                <div id="studentFilterBtns" class="flex flex-wrap gap-1">
                                    <!-- Dynamic student buttons -->
                                </div>
                            </div>
                        </div>
                        <div id="chartItemSelector"
                            class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-2 bg-slate-50 rounded-xl border border-slate-100">
                            <!-- Items will be populated dynamically -->
                            <div class="text-slate-400 text-sm italic">請先匯入評量資料</div>
                        </div>
                    </div>
                </div>
                <!-- Chart Grid -->
                <div class="flex-1 p-8 overflow-auto">
                    <div class="grid grid-cols-1 gap-8" id="chartGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="progressOverlay"
        class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[300] flex items-center justify-center">
        <div
            class="bg-white p-8 rounded-[3rem] shadow-2xl flex flex-col items-center max-w-sm w-full relative border border-slate-100">
            <div class="loading-ring mb-4"></div>
            <p id="progressText" class="font-bold text-lg text-slate-700 text-center tracking-tighter">系統同步解析中...</p>
            <div class="w-full bg-slate-100 h-2 rounded-full mt-6 overflow-hidden shadow-inner border border-slate-50">
                <div id="progressBar" class="bg-teal-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script src="parser.js"></script>
    <script src="app.js"></script>
</body>

</html>
